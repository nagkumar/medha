	:root

	    /*--pattern-alpha: 0.04;*/

	    --accent-rgb: 70, 120, 70;*/

	    /* Yellow */

	}

	*
	{
	    box-sizing: border-box;
	}

	body

	    margin: 0;
	    padding: 24px;
	    display: flex;
	    justify-content: center;
	    font-family: 'EB Garamond', serif;

	    background: linear-gradient(

	}

	.card

	    position: relative;
	    width: 900px;
	    padding: 14px;
	    border-radius: 6px;

	    background: var(--card-bg);

	    background-image: radial-gradient(circle at 8% 6%, rgba(var(--accent-rgb), var(--accent-alpha)), transparent 22%),
	    radial-gradient(circle at 92% 6%, rgba(var(--accent-rgb), var(--accent-alpha)), transparent 22%),
	    radial-gradient(circle at 8% 96%, rgba(var(--accent-rgb), var(--accent-alpha)), transparent 22%),
	    radial-gradient(circle at 92% 96%, rgba(var(--accent-rgb), var(--accent-alpha)), transparent 22%),

	.inner-border

	    border: 2px solid var(--gold-dark);
	    border-radius: 4px;
	    padding: 26px 34px 30px;
	    position: relative;
	}

	.corner
	{
	    position: absolute;
	    width: 70px;
	    height: 70px;
	    pointer-events: none;
	}

	.corner svg
	{
	    width: 100%;
	    height: 100%;
	}

	.corner.tl
	{
	    top: 6px;
	    left: 6px;
	}

	.corner.tr
	{
	    top: 6px;
	    right: 6px;
	    transform: scaleX(-1);
	}

	.corner.bl
	{
	    bottom: 6px;
	    left: 6px;
	    transform: scaleY(-1);
	}

	.corner.br
	{
	    bottom: 6px;
	    right: 6px;
	    transform: scale(-1, -1);
	}

	.invocation

	    text-align: center;
	    font-family: 'Cinzel', serif;
	    letter-spacing: 2px;
	    color: var(--maroon-dark);
	    font-size: 14px;
	    font-weight: 600;
	    margin-bottom: 6px;

	.om-wrap

	.om

	    margin-bottom: 18px;

	.section-header

	    align-items: center;
	}

	.photo-frame

	    border-radius: 6px;
	    overflow: hidden;
	    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);

        }

	.inset-photo

	    right: 36px;

	    height: 112px;

	.two-col

	    border-radius: 8px;
	    padding: 14px 16px;
	    background: rgba(255, 255, 255, 0.35);
